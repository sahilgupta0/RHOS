services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rhos-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./datasets:/app/datasets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rhos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rhos-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rhos-network

networks:
  rhos-network:
    driver: bridge
